# Stellar Events Configuration
# Copy this file to config.toml and modify as needed

# =============================================================================
# Source Data
# =============================================================================
[source]
# Path to ledger chunk files
ledger_dir = "./data/ledgers"

# Network: "mainnet", "testnet", or custom passphrase
network = "mainnet"

# =============================================================================
# Storage
# =============================================================================
# At least one backend (rocksdb or segment_files) must be enabled.
# When both are enabled, events are written to both; queries use flat files.
[storage]

# --- Backend Selection ---
# Enable RocksDB backend
rocksdb = false

# Enable flat file segment backend
segment_files = true

# --- RocksDB Options (ignored when rocksdb = false) ---
# Path to RocksDB database directory
db_path = "./rocksdb/events"

# Write performance
write_buffer_size_mb = 2048
max_write_buffer_number = 8
min_write_buffer_number_to_merge = 2

# Read performance
block_cache_size_mb = 512
bloom_filter_bits_per_key = 10
cache_index_and_filter_blocks = true

# Background jobs
max_background_jobs = 8

# Compression
compression = "zstd"
bottommost_compression = "zstd"

# WAL
disable_wal = true

# Compaction
disable_auto_compaction = true
target_file_size_mb = 1024
max_bytes_for_level_base_mb = 20480


# --- Flat File Segment Options (ignored when segment_files = false) ---
# Base directory for segment flat files (required if segment_files = true)
segment_path = "./lfs/events"

# Zstd compress event data blocks
compress_data = true

# Events per compression block (default: 128)
block_size = 128

# =============================================================================
# Ingestion
# =============================================================================
[ingestion]
# Progress file path (empty = disabled, writes every 10k ledgers)
progress_file = "progress.json"

final_compaction = false

# Compute event stats after ingestion (slow)
compute_stats = false

# Index maintenance
unique_indexes = true

# Parallelism
workers = 0       # 0 = all CPUs
batch_size = 100
queue_size = 0    # 0 = workers * 2

# =============================================================================
# Query
# =============================================================================
[query]
# Max ledgers to scan if end not specified
max_ledger_range = 10000

# Default max events to return
default_limit = 100
