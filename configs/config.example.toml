# Stellar Events Configuration
# Copy this file to config.toml and modify as needed

# =============================================================================
# Source Data
# =============================================================================
[source]
# Path to ledger chunk files
ledger_dir = "./data/ledgers"

# Network: "mainnet", "testnet", or custom passphrase
network = "mainnet"

# =============================================================================
# Storage (RocksDB)
# =============================================================================
[storage]
# Path to RocksDB database directory
db_path = "./rocksdb/events"

# Event storage format: "xdr" (default) or "binary" (faster queries)
# - xdr: Store raw XDR bytes (smaller, but requires XDR parsing on query)
# - binary: Store pre-decoded fields (larger ~10%, but ~10-15x faster queries)
# Note: Must reingest data when changing this option
event_format = "xdr"

# --- Write Performance ---
# Memtable size in MB (larger = better write throughput, more memory)
write_buffer_size_mb = 256

# Number of memtables to keep in memory
max_write_buffer_number = 4

# Minimum memtables to merge before flushing
min_write_buffer_number_to_merge = 2

# --- Read Performance ---
# Block cache size in MB (larger = better read performance)
block_cache_size_mb = 512

# Bloom filter bits per key (10 is good balance, 0 to disable)
bloom_filter_bits_per_key = 10

# Cache index and filter blocks in block cache
cache_index_and_filter_blocks = true

# --- Background Jobs ---
# Parallel background threads for flushing memtables
max_background_jobs = 8

# --- Compression ---
compression = "zstd"
bottommost_compression = "zstd"

# --- WAL ---
disable_wal = true

# --- Compaction ---
disable_auto_compaction = true

# Target SST file size in MB (larger = fewer files)
target_file_size_mb = 256

# Max bytes for level 1 in MB
max_bytes_for_level_base_mb = 1024

# --- Flat File Segment Indexes ---
# Base directory for segment flat files (empty = disabled)
# segment_file_path = "./data/segments"

# Enable writing flat file indexes at segment boundaries
# enable_segment_files = false

# Write event data to flat files alongside indexes
# enable_event_volume = false

# Zstd compress per-event blobs in event volume files (experimental)
# compress_event_volume = false

# =============================================================================
# Ingestion
# =============================================================================
[ingestion]
# Progress file path (empty = disabled, writes every 10k ledgers)
progress_file = "progress.json"

final_compaction = false

# Compute event stats after ingestion (slow)
compute_stats = false

# Index maintenance
v2_indexes = true
unique_indexes = true

index_flush_interval = 10000

# --- Parallelism ---
# Number of parallel workers (0 = all CPUs)
workers = 0

# Ledgers to batch before writing
batch_size = 100

# Pipeline buffer size (0 = workers * 2)
queue_size = 0


#exclude_topic0 = ["AAAADwAAAAh0cmFuc2Zlcg==","AAAADwAAAANmZWUA","AAAADwAAAARtaW50","AAAADwAAAARidXJu","AAAADwAAAA5zZXRfYXV0aG9yaXplZAAA","AAAADwAAAAhjbGF3YmFjaw==","AAAADgAAAARzd2Fw","AAAADwAAAARzd2Fw"]

# =============================================================================
# Query
# =============================================================================
[query]
# Max ledgers to scan if end not specified
max_ledger_range = 100000

# Default max events to return
default_limit = 100
